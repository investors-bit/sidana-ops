name = "sidana-ops"
compatibility_date = "2026-10-01"

# next-on-pages output. `npm run pages:build` writes here.
pages_build_output_dir = ".vercel/output/static"

# Required for Next on Cloudflare: the Supabase client and parts of the Next
# runtime use Node built-ins, which only exist on Workers with this flag.
compatibility_flags = ["nodejs_compat"]

# Runtime variables for the Worker.
#
# These MUST live here, not in the dashboard. Because this project has a
# wrangler.toml, Cloudflare treats it as the source of truth for plain
# variables and the dashboard will only accept encrypted secrets.
#
# Setting them as build variables alone is not enough: middleware and the edge
# routes read process.env at REQUEST time inside the Worker, so without these
# the Supabase client is constructed with undefined and every route returns a
# 500, including the static /login page, because middleware runs first.
#
# Both values are public by design. They are shipped to every browser that
# opens the site, which is exactly what the publishable key is for. The
# service_role / secret key must NEVER appear here; it stays in n8n.
[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://elwaquzawoscotlojtnv.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_0Uoh7ZQjv_yq9swBZO8eLQ_zi6I7-Q7"

# Preview deployments get their own environment and do NOT inherit [vars].
# Without this block every preview build 500s exactly as production did.
[env.preview.vars]
NEXT_PUBLIC_SUPABASE_URL = "https://elwaquzawoscotlojtnv.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_0Uoh7ZQjv_yq9swBZO8eLQ_zi6I7-Q7"
